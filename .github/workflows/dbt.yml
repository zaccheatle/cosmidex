name: DBT CI
on:
    pull_request:
        paths: 
            - cosmidex_dbt/**
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.14"
            - run: "pip install sqlfluff"
            - run: "sqlfluff lint cosmidex_dbt"