[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmidex-mcp"
version = "0.1.0"
description = "MCP server exposing CosmiDex exoplanet data as tools for LLM clients."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
    "psycopg2-binary",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["cosmidex_mcp*"]
