version: 2

exposures:
  - name: cosmidex_api
    label: CosmiDex FastAPI
    type: application
    maturity: medium
    url: http://127.0.0.1:8000
    description: >
      FastAPI service exposing planet data endpoints (list/search/filter by tier,
      single-planet detail, latest pipeline audit) to the frontend.
    depends_on:
      - ref('mart_planet_profile')
      - ref('mart_habitability_scores')
      - ref('mart_planet_image_prompt')
    owner:
      name: Zac Cheatle

  - name: cosmidex_frontend
    label: CosmiDex React Frontend
    type: application
    maturity: medium
    description: >
      React + Vite single-page app displaying exoplanet cards, stats, and
      habitability scores. Consumes cosmidex_api, which reads these marts.
    depends_on:
      - ref('mart_planet_profile')
      - ref('mart_planet_image_prompt')
    owner:
      name: Zac Cheatle
